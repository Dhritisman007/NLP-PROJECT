[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mml"
version = "0.1.0"
description = "Detection and correction of meaning loss in machine translation"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
mml = "mml.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
markers = ["slow: loads real models / downloads weights (run with: pytest -m slow)"]
